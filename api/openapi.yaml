openapi: 3.1.0
info:
  title: OHelpdesck Foundation API
  version: 0.1.0
paths:
  /health/live:
    get:
      operationId: liveness
      responses:
        '200':
          description: Process is alive independently of dependencies
          headers:
            X-Request-ID:
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: live}
  /health/ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: PostgreSQL ready; optional dependencies may be degraded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
        '503':
          description: PostgreSQL unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
  /api/v1/auth/login:
    post:
      operationId: localPasswordLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Server session created; response also sets an HttpOnly cookie.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '401': {description: Invalid credentials or disabled user, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: Login rate limit reached, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Session revoked}
        '401': {description: No valid session, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Invalid CSRF token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/me:
    get:
      operationId: getMe
      responses:
        '200':
          description: Effective authenticated profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {description: No valid session, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/users:
    get:
      operationId: listUsers
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/User'}}
        '401': {description: No valid session, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Missing user.manage, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    post:
      operationId: createUser
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: No valid session, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Missing user.manage or invalid CSRF token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Login or email already exists, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/users/{id}:
    patch:
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserRequest'}
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: No valid session, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Missing user.manage or invalid CSRF token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: User not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Last administrator or uniqueness constraint, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/users/{id}/permission-bundles:
    put:
      operationId: setUserPermissionBundles
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bundle_ids]
              properties:
                bundle_ids: {type: array, items: {type: string, format: uuid}, uniqueItems: true}
      responses:
        '204': {description: Assignments replaced}
        '401': {description: No valid session, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Missing role.manage or invalid CSRF token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: User or bundle not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/permission-bundles:
    get:
      operationId: listPermissionBundles
      responses:
        '200':
          description: Permission bundles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/PermissionBundle'}}
        '401': {description: No valid session, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Missing role.manage, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    post:
      operationId: createPermissionBundle
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePermissionBundleRequest'}
      responses:
        '201':
          description: Bundle created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionBundle'}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: No valid session, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Missing role.manage or invalid CSRF token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Bundle name already exists, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/conversations/{id}/status:
    patch:
      operationId: changeConversationStatus
      security: [{SessionCookie: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeConversationStatusRequest'}
      responses:
        '200': {description: Conversation status updated, content: {application/json: {schema: {$ref: '#/components/schemas/Conversation'}}}}
        '400': {description: Invalid JSON, enum, expected_version or snooze deadline, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: No valid session, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Invalid CSRF, missing conversation.reply or Channel can_reply membership, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: Conversation not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Stale expected_version or invalid state transition, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/conversations/{id}/priority:
    patch:
      operationId: setConversationPriority
      security: [{SessionCookie: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetConversationPriorityRequest'}
      responses:
        '200': {description: Conversation priority updated, content: {application/json: {schema: {$ref: '#/components/schemas/Conversation'}}}}
        '400': {description: Invalid JSON, enum or expected_version, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: No valid session, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Invalid CSRF, missing conversation.reply or Channel can_reply membership, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: Conversation not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Stale expected_version, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: ohelpdesck_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 32}
  schemas:
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: {type: string, enum: [ready, not_ready]}
        checks:
          type: object
          required: [postgres, redis, object_storage]
          additionalProperties: false
          properties:
            postgres: {type: string, enum: [ok, unavailable]}
            redis: {type: string, enum: [ok, degraded]}
            object_storage: {type: string, enum: [ok, degraded]}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object, additionalProperties: {type: string}}
            request_id: {type: string}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login: {type: string, minLength: 1, maxLength: 255}
        password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
    LoginResponse:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token: {type: string, minLength: 32}
    Role:
      type: string
      enum: [agent, supervisor, administrator]
    UserStatus:
      type: string
      enum: [active, disabled]
    User:
      type: object
      additionalProperties: false
      required: [id, login, email, name, role, status]
      properties:
        id: {type: string, format: uuid}
        login: {type: string}
        email: {type: string}
        name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        status: {$ref: '#/components/schemas/UserStatus'}
        permissions:
          type: array
          items: {type: string}
          uniqueItems: true
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [login, email, name, password, role]
      properties:
        login: {type: string, minLength: 1, maxLength: 255}
        email: {type: string, minLength: 1, maxLength: 320}
        name: {type: string, minLength: 1, maxLength: 255}
        password: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
        role: {$ref: '#/components/schemas/Role'}
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        email: {type: string, minLength: 1, maxLength: 320}
        name: {type: string, minLength: 1, maxLength: 255}
        password: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
        role: {$ref: '#/components/schemas/Role'}
        status: {$ref: '#/components/schemas/UserStatus'}
    PermissionBundle:
      type: object
      additionalProperties: false
      required: [id, name, permissions]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        permissions: {type: array, items: {type: string}, uniqueItems: true}
    CreatePermissionBundleRequest:
      type: object
      additionalProperties: false
      required: [name, permissions]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        permissions: {type: array, items: {type: string}, uniqueItems: true}

    ConversationStatus:
      type: string
      enum: [open, pending, resolved, snoozed]
    ConversationPriority:
      type: string
      enum: [low, normal, high, urgent]
    Conversation:
      type: object
      additionalProperties: false
      required: [id, channel_id, status, priority, version]
      properties:
        id: {type: string, format: uuid}
        channel_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/ConversationStatus'}
        priority: {$ref: '#/components/schemas/ConversationPriority'}
        resolved_at: {type: [string, 'null'], format: date-time}
        snoozed_until: {type: [string, 'null'], format: date-time}
        version: {type: integer, format: int64, minimum: 1}
    ChangeConversationStatusRequest:
      type: object
      additionalProperties: false
      required: [expected_version, status]
      properties:
        expected_version: {type: integer, format: int64, minimum: 1}
        status: {$ref: '#/components/schemas/ConversationStatus'}
        snoozed_until: {type: string, format: date-time}
    SetConversationPriorityRequest:
      type: object
      additionalProperties: false
      required: [expected_version, priority]
      properties:
        expected_version: {type: integer, format: int64, minimum: 1}
        priority: {$ref: '#/components/schemas/ConversationPriority'}
